<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

:root {
  color-scheme: light;
  --navy: #172554;
  --navy-soft: #1e3a6d;
  --blue: #2563eb;
  --blue-soft: #eff6ff;
  --bg: #f8fafc;
  --surface: #fff;
  --ink: #0f172a;
  --muted: #64748b;
  --line: #e2e8f0;
  --green: #16a34a;
  --green-bg: #f0fdf4;
  --amber: #b45309;
  --amber-bg: #fffbeb;
  --red: #dc2626;
  --red-bg: #fef2f2;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .035);
  --radius: 14px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 'DM Sans', sans-serif; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
#app { min-height: 100vh; }

#sidebar { position: fixed; inset: 0 auto 0 0; z-index: 10; width: 250px; padding: 22px 14px 16px; display: flex; flex-direction: column; overflow-y: auto; background: var(--navy); color: #fff; }
.brand { display: flex; align-items: center; gap: 11px; padding: 1px 10px 24px; color: #fff; font: 800 15px Manrope, sans-serif; letter-spacing: .4px; }
.brand-mark { display: grid; flex: 0 0 auto; place-items: center; width: 36px; height: 36px; border-radius: 11px; background: var(--blue); color: #fff; font: 800 19px Manrope; }
.brand-sub { display: block; margin-top: 3px; color: #b6c5de; font: 400 10px 'DM Sans', sans-serif; letter-spacing: 0; }
.brand-mark.large { width: 54px; height: 54px; margin: 0 auto 19px; border-radius: 16px; font-size: 25px; }
.nav-label { padding: 15px 12px 7px; color: #9baac5; font-size: 10px; font-weight: 700; letter-spacing: 1.15px; }
.nav-item { display: flex; align-items: center; gap: 11px; width: 100%; margin: 2px 0; padding: 9px 12px; border: 0; border-radius: 8px; background: transparent; color: #d3dced; text-align: left; font-size: 13px; transition: background .16s, color .16s, transform .16s; }
.nav-item:hover { background: #ffffff12; color: #fff; }
.nav-item.active { background: #263d70; color: #fff; font-weight: 600; box-shadow: inset 3px 0 #60a5fa; }
.nav-icon { width: 19px; color: #a9bbd8; text-align: center; font-size: 16px; }
.nav-item.active .nav-icon { color: #bfdbfe; }
.side-foot { margin-top: auto; padding: 15px 12px 0; border-top: 1px solid #ffffff1c; color: #b5c2d8; font-size: 11px; }
.online-dot { display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: #4ade80; }

.shell { display: flex; min-height: 100vh; margin-left: 250px; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 8; display: flex; align-items: center; height: 68px; padding: 0 30px; border-bottom: 1px solid var(--line); background: #ffffffed; backdrop-filter: blur(12px); }
.crumb { color: var(--navy); font: 700 15px Manrope, sans-serif; }
.top-actions { display: flex; align-items: center; gap: 16px; margin-left: auto; }
.today { color: var(--muted); font-size: 12px; }
.user-chip { display: flex; align-items: center; gap: 9px; border: 0; background: transparent; color: var(--ink); text-align: left; }
.user-chip b, .user-chip small { display: block; }
.user-chip b { font-size: 12px; }
.user-chip small { margin-top: 2px; color: var(--muted); font-size: 10px; }
.avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--blue-soft); color: var(--blue); font-weight: 700; }
.logout { padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: #475569; font-size: 12px; transition: .16s; }
.logout:hover { border-color: #cbd5e1; background: #f8fafc; }
.icon-button { display: none; margin-right: 12px; border: 0; background: transparent; color: var(--navy); font-size: 20px; }
main { flex: 1; width: 100%; max-width: 1500px; margin: 0 auto; padding: 30px 32px 44px; }
footer { padding: 15px 32px; border-top: 1px solid var(--line); color: #94a3b8; font-size: 10px; }
footer span { padding: 0 6px; }
footer a { color: inherit; text-decoration: none; }
footer a:hover { text-decoration: underline; }
.login-credit { display: inline-block; margin-top: 8px; color: #94a3b8; font-size: 11px; text-decoration: none; }
.login-credit:hover { text-decoration: underline; }
.registration-panel { margin-top: 16px; text-align: left; }
.registration-card { padding: 16px; border: 1px solid var(--line); border-radius: 12px; background: #f8fafc; }
.registration-card h2 { margin: 0 0 7px; color: var(--navy); font-size: 15px; }
.registration-card p { margin: 0 0 13px; color: var(--muted); font-size: 12px; line-height: 1.55; }
.registration-card label { display: block; margin-bottom: 6px; color: var(--navy); font-size: 11px; font-weight: 700; }
.registration-card input { width: 100%; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
.registration-card .btn { margin-top: 4px; }
.registration-switch { display: block; margin: 12px auto 0; }
.danger-text { color: var(--red); }

.page-title { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin: 1px 0 23px; }
.page-title h1 { margin: 2px 0 5px; color: var(--navy); font: 800 27px/1.25 Manrope, sans-serif; letter-spacing: -.45px; }
.page-title p { margin: 0; color: var(--muted); font-size: 13px; }
.eyebrow { color: var(--blue); font-size: 10px; font-weight: 700; letter-spacing: 1px; }
.grid { display: grid; gap: 16px; }
.grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { min-width: 0; padding: 19px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); transition: border-color .18s, box-shadow .18s; }
.card:hover { border-color: #d7e0eb; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
.card-head h2, .card h2 { margin: 0; color: var(--navy); font: 700 15px/1.35 Manrope, sans-serif; }
.stat-card { position: relative; overflow: hidden; }
.stat-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
.stat-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); font-size: 16px; }
.stat-value { margin-top: 15px; color: var(--navy); font: 800 28px/1.15 Manrope, sans-serif; letter-spacing: -.5px; }
.stat-note { margin-top: 4px; color: var(--muted); font-size: 11px; }
.section-gap { margin-top: 17px; }
.two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }

.table-wrap { overflow: auto; border: 1px solid var(--line); border-radius: 10px; scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }
table { width: 100%; min-width: 650px; border-collapse: collapse; }
th { padding: 12px 14px; background: #f8fafc; color: #64748b; text-align: left; text-transform: uppercase; white-space: nowrap; font-size: 10px; font-weight: 700; letter-spacing: .55px; }
td { padding: 12px 14px; border-top: 1px solid #edf1f5; color: #334155; vertical-align: middle; font-size: 12px; }
tbody tr { transition: background .12s; }
tbody tr:hover { background: #f8fbff; }
.empty { padding: 35px 15px; color: var(--muted); text-align: center; }
.badge { display: inline-flex; align-items: center; padding: 4px 9px; border-radius: 30px; white-space: nowrap; font-size: 10px; font-weight: 700; line-height: 1.25; }
.badge.green { background: var(--green-bg); color: var(--green); }
.badge.amber { background: var(--amber-bg); color: var(--amber); }
.badge.red { background: var(--red-bg); color: var(--red); }
.badge.gray { background: #f1f5f9; color: #64748b; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 9px 13px; border: 1px solid transparent; border-radius: 8px; font-size: 12px; font-weight: 700; transition: background .16s, color .16s, border-color .16s, box-shadow .16s, transform .16s; }
.btn:not(:disabled):hover { transform: translateY(-1px); box-shadow: 0 4px 12px #17255415; }
.btn:disabled { opacity: .48; cursor: not-allowed; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-outline { border-color: #d8e1ec; background: #fff; color: #334155; }
.btn-outline:hover { background: #f8fafc; }
.btn-soft { background: var(--blue-soft); color: var(--blue); }
.btn-danger { background: var(--red-bg); color: var(--red); }
.btn-sm { padding: 6px 9px; font-size: 10px; }
.btn-wide { width: 100%; padding: 12px; }
.toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.toolbar-left, .toolbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.field { display: flex; min-width: 0; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.field label { color: #475569; font-size: 11px; font-weight: 700; }
.field input, .field select, .field textarea, .control { min-width: 0; padding: 10px 11px; border: 1px solid #d8e1ec; border-radius: 8px; outline: none; background: #fff; color: var(--ink); transition: border-color .16s, box-shadow .16s; }
.field input:focus, .field select:focus, .field textarea:focus, .control:focus { border-color: #60a5fa; box-shadow: 0 0 0 3px #dbeafe; }
.field input::placeholder, .control::placeholder { color: #94a3b8; }
.field input:disabled, .field select:disabled { background: #f1f5f9; color: #94a3b8; }
.field textarea { min-height: 80px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 13px; }
.span-2 { grid-column: span 2; }
.helper { color: var(--muted); font-size: 10px; }
.action-link { padding: 3px 6px; border: 0; background: none; color: var(--blue); font-size: 11px; font-weight: 700; }
.action-link:hover { color: #1d4ed8; text-decoration: underline; }
.row-title { color: var(--navy); font-size: 12px; font-weight: 700; }
.row-sub { margin-top: 4px; color: var(--muted); font-size: 10px; }
.filterbar { display: flex; align-items: end; gap: 9px; flex-wrap: wrap; }
.filterbar .field { min-width: 140px; margin: 0; }
.notice { padding: 11px 13px; border: 1px solid transparent; border-radius: 9px; font-size: 11px; line-height: 1.5; }
.notice.info { border-color: #dbeafe; background: #eff6ff; color: #1e40af; }
.notice.warn { border-color: #fde68a; background: var(--amber-bg); color: #854d0e; }

.attendance-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 24px; border: 1px solid #203b74; border-radius: var(--radius); background: var(--navy); color: #fff; }
.attendance-hero h2 { margin: 8px 0; color: #fff; font: 800 19px Manrope, sans-serif; }
.attendance-hero p { margin: 0; color: #dbeafe; font-size: 12px; }
.hero-status { color: #bfdbfe; font-size: 11px; }
.punch-card { max-width: 430px; padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); box-shadow: var(--shadow); }
.punch-card .btn { flex: 1; }
.punch-clock { margin: 5px 0 12px; color: var(--navy); font: 800 27px Manrope, sans-serif; }
.row { display: flex; gap: 8px; }

.login-screen { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; overflow-y: auto; padding: 20px; background: #f1f5f9; }
.hidden { display: none !important; }
.login-box { width: min(410px, 100%); padding: 38px 36px; border: 1px solid var(--line); border-radius: 18px; background: #fff; box-shadow: 0 22px 70px #17255417; text-align: center; }
.login-box h1 { margin: 8px 0; color: var(--navy); font: 800 25px Manrope, sans-serif; }
.login-box > p { margin: 8px 0 22px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.login-box .login-note { margin: 18px 0 0; font-size: 10px; }
.login-box .btn span { font: bold 16px Arial; }
.login-box #credential-panel { margin: 10px 0 16px; text-align: left; }
.login-box #credential-panel .btn-wide { margin: 4px 0 10px; }
.login-box #show-signup, .login-box #cancel-signup { display: block; margin: 8px auto; }
.login-box #signup-panel { margin-top: 12px; }
.login-divider { display: flex; align-items: center; gap: 12px; margin: 14px 0 10px; color: #94a3b8; font-size: 11px; }
.login-divider::before, .login-divider::after { content: ""; height: 1px; flex: 1; background: var(--line); }
.form-error { margin-top: 9px; color: var(--red); font-size: 11px; }
.modal-backdrop { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 15px; background: #0f172a80; backdrop-filter: blur(3px); }
.modal { width: min(580px, 100%); max-height: 90vh; overflow: auto; padding: 22px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; box-shadow: 0 20px 70px #0f172a40; animation: modal-in .18s ease-out; }
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-head h2 { margin: 0; color: var(--navy); font: 800 17px Manrope, sans-serif; }
.modal-close { width: 30px; height: 30px; border: 0; border-radius: 7px; background: #f1f5f9; color: #475569; font-size: 18px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 12px; }
.toast { position: fixed; right: 22px; bottom: 22px; z-index: 50; max-width: 360px; padding: 13px 17px; border-radius: 10px; background: var(--navy); color: #fff; box-shadow: 0 8px 25px #0f172a30; font-size: 12px; line-height: 1.45; opacity: 0; transform: translateY(10px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast.error { background: #991b1b; }
.loading-card { padding: 28px; border: 1px solid var(--line); border-radius: 12px; background: #fff; color: var(--muted); }
.progress { overflow: hidden; height: 5px; border-radius: 10px; background: #e2e8f0; }
.progress i { display: block; height: 100%; background: var(--blue); }
.profile-head { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; padding-bottom: 17px; border-bottom: 1px solid var(--line); }
.profile-head .avatar { width: 52px; height: 52px; font-size: 20px; }
.profile-name { color: var(--navy); font: 800 18px Manrope, sans-serif; }
.profile-meta { margin-top: 4px; color: var(--muted); font-size: 11px; }
.kv { display: grid; grid-template-columns: 145px 1fr; gap: 11px; padding: 9px 0; border-bottom: 1px solid #f1f5f9; font-size: 12px; }
.kv span:first-child { color: var(--muted); }
.bar-row { display: grid; grid-template-columns: 100px 1fr 30px; align-items: center; gap: 10px; margin: 13px 0; font-size: 11px; }
.bar { overflow: hidden; height: 8px; border-radius: 10px; background: #e2e8f0; }
.bar i { display: block; height: 100%; border-radius: 10px; background: var(--blue); }

@keyframes modal-in { from { opacity: 0; transform: translateY(8px) scale(.99); } to { opacity: 1; transform: translateY(0) scale(1); } }
@media (max-width: 1100px) { .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  #sidebar { transform: translateX(-100%); transition: transform .2s; box-shadow: 12px 0 32px #0f172a20; }
  #sidebar.open { transform: translateX(0); }
  #sidebar.open::after { position: fixed; inset: 0 0 0 250px; z-index: -1; background: #0f172a70; content: ''; }
  .shell { margin-left: 0; }
  .icon-button { display: block; }
  .topbar { height: 60px; padding: 0 14px; }
  .today { display: none; }
  main { padding: 22px 14px 34px; }
  footer { padding: 13px 15px; }
  .top-actions { gap: 8px; }
  .user-chip span:not(.avatar) { display: none; }
  .logout { padding: 7px 9px; }
  .grid-3, .grid-2, .two-col { grid-template-columns: 1fr; }
  .attendance-hero { align-items: stretch; flex-direction: column; padding: 20px; }
  .punch-card { max-width: none; }
  .page-title h1 { font-size: 23px; }
  .form-grid { grid-template-columns: 1fr; }
  .span-2 { grid-column: auto; }
  .table-wrap table { min-width: 620px; }
  .modal-backdrop { align-items: end; padding: 0; }
  .modal { width: 100%; max-height: 88vh; padding: 20px 17px calc(20px + env(safe-area-inset-bottom)); border-radius: 16px 16px 0 0; }
  .modal-foot { position: sticky; bottom: -20px; padding: 13px 0 4px; background: #fff; }
  .toast { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); left: 12px; max-width: none; text-align: center; }
}
@media (max-height: 760px) { .login-screen { align-content: start; padding-top: max(14px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom)); } }
@media (max-width: 440px) {
  .topbar .crumb { font-size: 14px; }
  .page-title { align-items: flex-start; flex-direction: column; }
  .toolbar h2 { font-size: 14px; }
  .filterbar { align-items: stretch; }
  .filterbar .field { min-width: 0; flex: 1 1 42%; }
  .filterbar > .btn { align-self: flex-end; }
  .grid-4 { gap: 9px; }
  .stat-card { padding: 14px 12px; }
  .stat-top { font-size: 11px; }
  .stat-value { font-size: 23px; }
  .stat-icon { width: 30px; height: 30px; }
  .card { padding: 15px; }
  .login-box { padding: 30px 22px; }
  .attendance-hero { padding: 18px; }
  .punch-clock { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; } }
</style>
