<style>
:root{font-family:Inter,Arial,sans-serif;color:#172b4d;background:#f4f7fb;--blue:#155eef;--muted:#667085}*{box-sizing:border-box}body{margin:0}header{height:64px;background:#fff;border-bottom:1px solid #e5eaf2;display:flex;align-items:center;justify-content:space-between;padding:0 5vw;color:#123d70}main{max-width:1100px;margin:40px auto;padding:0 20px}.card{background:#fff;border:1px solid #e5eaf2;border-radius:16px;padding:24px;box-shadow:0 8px 24px #2233440a}.login{max-width:440px;margin:8vh auto;text-align:center}button{border:0;border-radius:9px;padding:11px 16px;background:#e8eef8;color:#183b64;font-weight:600;cursor:pointer}.primary{background:var(--blue);color:white}.danger{background:#fee4e2;color:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.muted{color:var(--muted)}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button.active{background:#dbeafe;color:#155eef}.stat{font-size:30px;font-weight:700;margin:8px 0}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:11px;border-bottom:1px solid #edf0f5}input,select{padding:10px;border:1px solid #d0d5dd;border-radius:8px;max-width:100%}#message{color:#b42318}@media(max-width:600px){main{margin:20px auto;padding:0 12px}.card{padding:17px}header{padding:0 14px}}
