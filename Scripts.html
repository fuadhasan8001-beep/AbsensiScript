<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script>
const firebaseConfig=window.FIREBASE_CONFIG;
let auth,token='',profile=null;const $=s=>document.querySelector(s);function call(action,p={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.ok?resolve(r.data):reject(Error(r.error))).withFailureHandler(reject).api(action,{...p,token}));}function msg(s){$('#message').textContent=s||''}function init(){if(firebaseConfig.apiKey.startsWith('SET_')){msg('Firebase belum dikonfigurasi. Lihat INSTALLATION.md.');return;}firebase.initializeApp(firebaseConfig);auth=firebase.auth();$('#signin').onclick=()=>{const provider=new firebase.auth.GoogleAuthProvider();auth.signInWithPopup(provider).catch(e=>msg(e.message));};auth.onAuthStateChanged(async u=>{if(!u){token='';$('#logout').hidden=true;renderLogin();return;}token=await u.getIdToken();try{profile=await call('bootstrap');$('#logout').hidden=false;$('#who').textContent=u.email;renderHome();}catch(e){msg(e.message);}});$('#logout').onclick=()=>auth.signOut();}function renderLogin(){$('#main').innerHTML='<section class="login card"><h1>Masuk ke sistem</h1><p class="muted">Gunakan akun Google terdaftar.</p><button id="signin" class="primary">Masuk dengan Google</button><p id="message"></p></section>';$('#signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>msg(e.message));}function renderHome(){const role=profile.user.role;$('#main').innerHTML='<div class="nav"><button class="active" data-page="home">Beranda</button><button data-page="attendance">Absensi</button><button data-page="history">Riwayat</button><button data-page="duty">Penugasan</button>'+(['SUPER_ADMIN','ADMIN_KECAMATAN','ADMIN_DESA'].includes(role)?'<button data-page="employees">Pegawai</button><button data-page="reports">Laporan</button>':'')+'</div><div id="view"></div>';document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');page(b.dataset.page);});page('home');}async function page(name){const v=$('#view');v.innerHTML='<div class="card">Memuat…</div>';try{if(name==='home'){const a=await call('attendanceToday');v.innerHTML='<div class="grid"><div class="card"><div class="muted">Status hari ini</div><div class="stat">'+(a?.checkInAt?'Hadir':'Belum hadir')+'</div></div><div class="card"><div class="muted">Check-in</div><div class="stat">'+(a?.checkInAt||'—')+'</div></div><div class="card"><div class="muted">Check-out</div><div class="stat">'+(a?.checkOutAt||'—')+'</div></div></div><div class="card" style="margin-top:16px"><h2>Absensi hari ini</h2><div class="row"><select id="office"></select><button class="primary" id="in">Check-in</button><button id="out">Check-out</button><span class="muted">Pastikan izin lokasi aktif.</span></div><p id="message"></p></div>';const offices=await call('officeList');$('#office').innerHTML=offices.map(o=>'<option value="'+o.officeId+'">'+o.name+'</option>').join('');$('#in').onclick=()=>punch('checkIn');$('#out').onclick=()=>punch('checkOut');}else if(name==='history'){const rows=await call('attendanceHistory');v.innerHTML='<div class="card"><h2>Riwayat absensi</h2><table><thead><tr><th>Tanggal</th><th>Check-in</th><th>Check-out</th><th>Terlambat</th></tr></thead><tbody>'+rows.map(a=>'<tr><td>'+a.date+'</td><td>'+a.checkInAt+'</td><td>'+a.checkOutAt+'</td><td>'+a.lateMinutes+' menit</td></tr>').join('')+'</tbody></table></div>';}else if(name==='employees'){const rows=await call('employeeList');v.innerHTML='<div class="card"><h2>Data pegawai</h2><table><tr><th>Nama</th><th>Email</th><th>Jabatan</th><th>Status</th></tr>'+rows.map(e=>'<tr><td>'+e.name+'</td><td>'+e.email+'</td><td>'+e.position+'</td><td>'+e.status+'</td></tr>').join('')+'</table></div>';}else if(name==='reports'){const r=await call('report',{from:profile.today,to:profile.today});v.innerHTML='<div class="card"><h2>Laporan harian</h2><p>Total absensi: '+r.summary.total+' · Terlambat: '+r.summary.late+'</p><button id="csv">Unduh CSV</button></div>';$('#csv').onclick=()=>downloadCsv(r.rows);}else if(name==='duty'){const rows=await call('dutyList');v.innerHTML='<div class="card"><h2>Penugasan lintas kantor</h2><div id="dutyrows">'+rows.map(d=>'<p>'+d.startAt+' – '+d.endAt+' · '+d.status+'</p>').join('')+'</div><p>Pengajuan dilakukan melalui admin yang berwenang.</p></div>';} }catch(e){v.innerHTML='<div class="card" id="error"></div>';$('#error').textContent=e.message;}}function punch(action){if(!navigator.geolocation){msg('GPS tidak tersedia pada perangkat ini.');return;}msg('Mengambil lokasi GPS…');navigator.geolocation.getCurrentPosition(async pos=>{try{const d=await call(action,{officeId:$('#office').value,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy});msg('Absensi berhasil tersimpan pada '+(d.checkInAt||d.checkOutAt));page('home');}catch(e){msg(e.message);}},e=>msg(e.code===1?'Lokasi belum diizinkan.':e.code===2?'GPS tidak tersedia.':'Waktu permintaan lokasi habis.'),{enableHighAccuracy:true,timeout:15000,maximumAge:0});}function downloadCsv(rows){const heads=Object.keys(rows[0]||{}),csv=[heads.join(','),...rows.map(r=>heads.map(h=>'"'+String(r[h]??'').replaceAll('"','""')+'"').join(','))].join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='laporan-absensi.csv';a.click();}init();
</script>
