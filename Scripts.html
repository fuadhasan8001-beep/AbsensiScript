
<script>
const CFG=window.FIREBASE_CONFIG, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let auth,token='',boot={},currentPage='dashboard',toastTimer;
const ROLE={SUPER_ADMIN:'Super Admin',ADMIN_KECAMATAN:'Admin Kecamatan',ADMIN_DESA:'Admin Desa',PEGAWAI:'Pegawai'};
const NAV=[['UTAMA',[['dashboard','▦','Dashboard'],['attendance','◷','Absensi'],['history','▤','Riwayat Absensi'],['profile','◉','Profil']]],['OPERASIONAL',[['duties','⇄','Penugasan Dinas'],['corrections','✎','Koreksi Absensi']]],['MANAJEMEN',[['employees','♙','Data Pegawai'],['offices','⌂','Data Kantor'],['attendanceAreas','◎','Koordinat Absensi'],['organization','⌘','Kecamatan & Desa'],['schedules','◷','Jadwal Kerja'],['holidays','▣','Kalender Libur'],['reports','▤','Laporan']]],['SISTEM',[['registrations','☑','Persetujuan Akun'],['audit','◉','Audit Log'],['settings','⚙','Pengaturan']]]];
const ADMIN=['SUPER_ADMIN','ADMIN_KECAMATAN','ADMIN_DESA'],MANAGER=['SUPER_ADMIN','ADMIN_KECAMATAN'];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function fmt(v){if(!v)return '—';const d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Jakarta'});}function dateId(v){if(!v)return '';const d=new Date(v);return isNaN(d)?String(v).slice(0,10):new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jakarta'}).format(d);}function badge(v){let s=String(v||'—'),cls=['ACTIVE','APPROVED','HADIR'].includes(s)?'green':['PENDING','MENUNGGU'].includes(s)?'amber':['REJECTED','INACTIVE'].includes(s)?'red':'gray';return `<span class="badge ${cls}">${esc(s)}</span>`;}
function api(action,p={},retryAuth=true){return new Promise((resolve,reject)=>{const failed=message=>{const msg=String(message||'Permintaan ditolak server.');if(msg.startsWith('Sesi login tidak valid')&&auth?.currentUser){if(retryAuth){auth.currentUser.getIdToken(true).then(fresh=>{token=fresh;api(action,p,false).then(resolve).catch(error=>{auth.signOut();reject(error);});}).catch(error=>{auth.signOut();reject(Error(error?.message||msg));});return;}auth.signOut();}reject(Error(msg));};google.script.run.withSuccessHandler(r=>{if(r&&r.ok){resolve(r.data);return;}failed(r?.error||(r?'Permintaan ditolak server.':'Server tidak memberikan respons. Muat ulang halaman; jika masih terjadi, pemilik perlu memeriksa Apps Script > Eksekusi.'));}).withFailureHandler(e=>failed(e?.message||String(e)||'Gagal menghubungi server Apps Script.')).api(action,{...p,token});});}
function toast(text,error=false){const t=$('#toast');t.textContent=text;t.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.className='toast',3600);}function fail(e){toast(e?.message||'Terjadi kesalahan',true);}function loading(){return '<div class="loading-card">Memuat data…</div>';}
function usernameEmail(value){const raw=String(value||'').trim().toLowerCase();if(raw.includes('@'))return raw;if(!/^[a-z0-9][a-z0-9._-]{2,31}$/.test(raw))throw new Error('Username harus 3–32 karakter: huruf, angka, titik, garis bawah, atau tanda hubung.');if(!CFG?.authDomain)throw new Error('Konfigurasi domain Firebase belum tersedia.');return raw+'@'+CFG.authDomain;}
function identityLabel(value){const email=String(value||''),suffix='@'+String(CFG?.authDomain||'').toLowerCase();return suffix!=='@'&&email.toLowerCase().endsWith(suffix)?email.slice(0,-suffix.length):email;}
function authErrorMessage(e){if(e?.code==='auth/unauthorized-domain')return 'Domain '+location.hostname+' belum diizinkan di Firebase Authentication. Tambahkan hostname ini pada Authorized domains.';if(e?.code==='auth/operation-not-allowed')return 'Login username/password belum aktif. Aktifkan Email/Password di Firebase Authentication > Sign-in method.';if(e?.code==='auth/email-already-in-use')return 'Username sudah digunakan. Silakan masuk atau gunakan username lain.';if(['auth/invalid-credential','auth/user-not-found','auth/wrong-password'].includes(e?.code))return 'Username atau password salah.';if(e?.code==='auth/weak-password')return 'Password terlalu lemah. Gunakan minimal 8 karakter.';return e?.message||'Login gagal. Silakan coba kembali.';}
function showCredentialSignup(show){$('#password-login-form').classList.toggle('hidden',show);$('#show-signup').classList.toggle('hidden',show);$('#signup-panel').classList.toggle('hidden',!show);}
function init(){const y=$('#year');y.textContent=new Date().getFullYear();if(!CFG?.apiKey||!CFG?.authDomain||!CFG?.projectId){showLogin('Konfigurasi Firebase belum lengkap. Ikuti panduan instalasi.');return;}firebase.initializeApp(CFG);auth=firebase.auth();$('#signin').onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>showLogin(authErrorMessage(e)));$('#show-signup').onclick=()=>{showCredentialSignup(true);$('#login-error').textContent='';};$('#cancel-signup').onclick=()=>{showCredentialSignup(false);$('#login-error').textContent='';};$('#password-login-form').onsubmit=async e=>{e.preventDefault();const btn=$('#password-login');btn.disabled=true;try{await auth.signInWithEmailAndPassword(usernameEmail($('#login-username').value),$('#login-password').value);}catch(err){showLogin(authErrorMessage(err));}finally{btn.disabled=false;}};$('#password-signup-form').onsubmit=async e=>{e.preventDefault();const name=$('#signup-name').value.trim(),username=$('#signup-username').value.trim().toLowerCase(),password=$('#signup-password').value;if(!name){showLogin('Nama lengkap wajib diisi.');showCredentialSignup(true);return;}if(password!==$('#signup-password-confirm').value){showLogin('Password dan konfirmasi password tidak sama.');showCredentialSignup(true);return;}const btn=$('#password-signup');btn.disabled=true;try{const credential=await auth.createUserWithEmailAndPassword(usernameEmail(username),password);await credential.user.updateProfile({displayName:name});}catch(err){showLogin(authErrorMessage(err));showCredentialSignup(true);}finally{btn.disabled=false;}};$('#logout').onclick=()=>auth.signOut();$('#menu-toggle').onclick=()=>$('#sidebar').classList.toggle('open');auth.onAuthStateChanged(async u=>{if(!u){token='';$('#app').classList.add('hidden');$('#login-screen').classList.remove('hidden');$('#credential-panel').classList.remove('hidden');$('#signin').classList.remove('hidden');showCredentialSignup(false);$('#login-error').textContent='';$('#registration-panel').innerHTML='';$('#registration-panel').classList.add('hidden');return;}try{token=await u.getIdToken(true);boot=await api('bootstrap');$('#login-screen').classList.add('hidden');$('#app').classList.remove('hidden');mountNav();updateUser(u);go('dashboard');}catch(e){try{const registration=await api('registrationStatus');if(registration.status==='ACTIVE'){showLogin(e.message);return;}showRegistration(u,registration);}catch(statusError){showLogin(statusError?.message||e.message);}}});}
function showRegistration(u,state){$('#app').classList.add('hidden');$('#login-screen').classList.remove('hidden');$('#login-error').textContent='';$('#signin').classList.add('hidden');$('#credential-panel').classList.add('hidden');const panel=$('#registration-panel');panel.classList.remove('hidden');const pending=state.status==='PENDING',approved=state.status==='ACTIVE';const heading=pending?'Pendaftaran menunggu persetujuan':approved?'Akun sudah disetujui':'Daftar akses aplikasi';const message=pending?'Permintaan Anda sudah diterima. Super Admin akan meninjau pendaftaran dan menetapkan role akun.':approved?'Akun sudah aktif. Muat ulang untuk masuk ke aplikasi.':state.status==='REJECTED'?'Permintaan sebelumnya ditolak. Anda dapat mengirim permintaan baru.':state.status==='INACTIVE'?'Akun ini nonaktif. Kirim permintaan aktivasi ulang kepada Super Admin.':'Akun berhasil dibuat. Lengkapi nama untuk mengajukan pendaftaran; akses diberikan setelah Super Admin menyetujui dan menentukan role.';panel.innerHTML=`<div class="registration-card"><h2>${esc(heading)}</h2><p>${esc(message)}</p>${identityLabel(u.email)!==u.email?'<p class="row-sub">Username: <b>'+esc(identityLabel(u.email))+'</b></p>':''}${pending?'':approved?'<button type="button" class="btn btn-primary btn-wide" id="registration-reload">Lanjutkan</button>':`<form id="registration-form"><label for="registration-name">Nama lengkap</label><input id="registration-name" name="name" required maxlength="150" value="${esc(state.name||u.displayName||'')}"><button type="submit" class="btn btn-primary btn-wide">Kirim permintaan</button></form>`}<button type="button" class="action-link registration-switch" id="registration-switch">Keluar dan kembali ke login</button><div id="registration-error" class="form-error"></div></div>`;$('#registration-switch').onclick=()=>auth.signOut();if(approved)$('#registration-reload').onclick=()=>location.reload();const form=$('#registration-form');if(form)form.onsubmit=async e=>{e.preventDefault();const button=form.querySelector('[type=submit]');button.disabled=true;try{const result=await api('registrationSubmit',{name:$('#registration-name').value});showRegistration(u,result);}catch(err){$('#registration-error').textContent=err.message||'Permintaan gagal dikirim.';button.disabled=false;}};}

function showLogin(s){$('#login-screen').classList.remove('hidden');$('#app').classList.add('hidden');$('#credential-panel').classList.remove('hidden');$('#signin').classList.remove('hidden');$('#registration-panel').classList.add('hidden');showCredentialSignup(false);$('#login-error').textContent=s||'';}
function updateUser(u){const emp=boot.employee||{},name=emp.name||u.displayName||u.email;$('#user-name').textContent=name;$('#user-role').textContent=ROLE[boot.user?.role]||boot.user?.role||'';$('#avatar').textContent=(name.trim()[0]||'U').toUpperCase();$('#today').textContent=new Intl.DateTimeFormat('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Jakarta'}).format(new Date());}
function mountNav(){const role=boot.user?.role||'PEGAWAI';let html='';NAV.forEach(([group,items])=>{let visible=items.filter(([id])=>{if(['dashboard','attendance','history','profile','duties'].includes(id))return true;if(id==='corrections')return role!=='PEGAWAI';if(['employees','reports','organization','attendanceAreas'].includes(id))return ADMIN.includes(role);if(['offices','schedules','holidays'].includes(id))return MANAGER.includes(role);if(id==='registrations'||id==='audit'||id==='settings')return role==='SUPER_ADMIN';return false;});if(visible.length)html+=`<div class="nav-label">${group}</div>`+visible.map(([id,ic,label])=>`<button class="nav-item" data-page="${id}"><span class="nav-icon">${ic}</span>${label}</button>`).join('');});$('#nav').innerHTML=html;$$('.nav-item').forEach(b=>b.onclick=()=>{go(b.dataset.page);$('#sidebar').classList.remove('open');});}
const TITLES={dashboard:['Dashboard','Ringkasan aktivitas kehadiran hari ini.'],attendance:['Absensi','Check-in dan check-out hanya di dalam radius 15 meter dari titik wilayah.'],history:['Riwayat Absensi','Lihat catatan kehadiran dan ajukan koreksi bila diperlukan.'],profile:['Profil Saya','Informasi akun dan penempatan kerja.'],duties:['Penugasan Dinas','Kelola tugas lintas kantor dan status persetujuannya.'],corrections:['Koreksi Absensi','Tinjau pengajuan perubahan dengan jejak audit.'],employees:['Data Pegawai','Kelola identitas, unit kerja, dan status pegawai.'],offices:['Data Kantor','Kelola unit dan status kantor.'],attendanceAreas:['Koordinat Absensi','Atur titik GPS masing-masing kecamatan dan desa dengan radius tetap 15 meter.'],organization:['Kecamatan & Desa','Kelola struktur wilayah instansi.'],schedules:['Jadwal Kerja','Atur hari kerja dan jendela absensi per kantor.'],holidays:['Kalender Libur','Daftarkan hari libur nasional dan daerah.'],reports:['Laporan Kehadiran','Filter rekap kehadiran dan ekspor data.'],registrations:['Persetujuan Akun','Tinjau pendaftaran baru dan tetapkan role akun.'],audit:['Audit Log','Jejak tindakan penting di dalam sistem.'],settings:['Pengaturan Sistem','Ringkasan konfigurasi aplikasi dan database.']};
async function go(page){currentPage=page;$$('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=TITLES[page]?.[0]||'Dashboard';$('#main').innerHTML=loading();try{await pages[page]();}catch(e){$('#main').innerHTML=`<div class="card"><h2>Data tidak dapat dimuat</h2><p class="row-sub">${esc(e.message)}</p><button class="btn btn-outline" onclick="go('${page}')">Coba lagi</button></div>`;}}
function title(page,action=''){const [h,p]=TITLES[page];return `<div class="page-title"><div><div class="eyebrow">SISTEM INFORMASI ABSENSI</div><h1>${h}</h1><p>${p}</p></div>${action}</div>`;}function table(headers,rows,empty='Belum ada data.'){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':`<div class="empty">${empty}</div>`}</div>`;}function stat(label,value,icon,note=''){return `<div class="card stat-card"><div class="stat-top"><span>${esc(label)}</span><span class="stat-icon">${icon}</span></div><div class="stat-value">${esc(value)}</div><div class="stat-note">${esc(note)}</div></div>`;}function modal(titleText,body,onSave,label='Simpan'){const root=$('#modal-root');root.innerHTML=`<div class="modal-backdrop"><section class="modal"><div class="modal-head"><h2>${esc(titleText)}</h2><button class="modal-close" id="mclose">×</button></div><form id="modal-form">${body}<div class="modal-foot"><button type="button" class="btn btn-outline" id="mcancel">Batal</button><button class="btn btn-primary" type="submit">${label}</button></div></form></section></div>`;$('#mclose').onclick=$('#mcancel').onclick=()=>root.innerHTML='';$('#modal-form').onsubmit=async e=>{e.preventDefault();const fd=Object.fromEntries(new FormData(e.currentTarget));const btn=e.currentTarget.querySelector('[type=submit]');btn.disabled=true;try{await onSave(fd);root.innerHTML='';toast('Data berhasil disimpan');await go(currentPage);}catch(err){btn.disabled=false;fail(err);}};}
function field(label,name,value='',type='text',opts={}){if(type==='select')return `<div class="field ${opts.span?'span-2':''}"><label>${label}</label><select name="${name}" ${opts.required?'required':''}>${(opts.options||[]).map(([v,t])=>`<option value="${esc(v)}" ${String(value)===String(v)?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;return `<div class="field ${opts.span?'span-2':''}"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}" ${opts.required?'required':''} ${opts.step?`step="${opts.step}"`:''} ${opts.min!==undefined?`min="${opts.min}"`:''} ${opts.placeholder?`placeholder="${esc(opts.placeholder)}"`:''}></div>`;}
function csvDownload(filename,headers,rows){const text=[headers,...rows].map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));a.download=filename;a.click();URL.revokeObjectURL(a.href);}
const pages={
async dashboard(){const d=await api('dashboard'),cards=d.cards||[];$('#main').innerHTML=title('dashboard')+`<div class="grid grid-4">${cards.map((c,i)=>stat(c.label,c.value,['♙','◉','↗','◷'][i%4],i===0?'Data terbarui hari ini':'Hari ini')).join('')}</div><div class="two-col section-gap"><section class="card"><div class="card-head"><h2>Aktivitas kehadiran</h2><button class="action-link" data-go="reports">Lihat laporan →</button></div>${cards.length?`<div class="bar-row"><span>Hadir</span><div class="bar"><i style="width:${cards[0].value?Math.min(100,(Number(cards[1]?.value||0)/Number(cards[0].value))*100):0}%"></i></div><b>${esc(cards[1]?.value||0)}</b></div><div class="notice info">Data kehadiran ditampilkan sesuai cakupan akses akun Anda.</div>`:'<div class="empty">Ringkasan aktivitas belum tersedia.</div>'}</section><section class="card"><div class="card-head"><h2>Akses cepat</h2></div><div class="grid grid-2"><button class="btn btn-soft" data-go="attendance">◷ &nbsp;Buka absensi</button><button class="btn btn-outline" data-go="history">▤ &nbsp;Riwayat</button></div><p class="row-sub section-gap">Tanggal sistem: ${esc(boot.today||'')}</p></section></div><section class="card section-gap"><div class="card-head"><h2>${ADMIN.includes(boot.user?.role)?'Kehadiran hari ini':'Riwayat terbaru'}</h2><button class="action-link" data-go="history">Selengkapnya →</button></div>${table(['Tanggal','Pegawai','Jam Masuk','Jam Pulang','Status'],(d.rows||[]).slice(0,8).map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.employeeId||boot.employee?.name||'Anda')}</td><td>${esc(fmt(a.checkInAt))}</td><td>${esc(fmt(a.checkOutAt))}</td><td>${badge(Number(a.lateMinutes)>0?'TERLAMBAT':a.checkOutAt?'SELESAI':'HADIR')}</td></tr>`).join(''))}</section>`;wireGo();},
async attendance(){const [today,offices]=await Promise.all([api('attendanceToday'),api('officeList')]);const emp=boot.employee||{},office=offices.find(o=>o.officeId===emp.primaryOfficeId),duties=(await api('dutyList')).filter(d=>d.status==='APPROVED'&&d.employeeId===emp.employeeId&&new Date(d.startAt)<=new Date()&&new Date(d.endAt)>=new Date());const choices=[...(office?[office]:[]),...duties.map(d=>offices.find(o=>o.officeId===d.officeId)).filter(Boolean)];const target=office?.villageId?'desa '+(boot.village?.name||office.villageId):'kecamatan '+(boot.district?.name||office?.districtId||'');$('#main').innerHTML=title('attendance')+`<section class="attendance-hero"><div><div class="hero-status">${new Intl.DateTimeFormat('id-ID',{dateStyle:'full',timeZone:'Asia/Jakarta'}).format(new Date())}</div><h2>${today?.checkInAt?'Kehadiran Anda tercatat':'Siap untuk melakukan absensi?'}</h2><p>Absensi memakai titik ${esc(target)} dengan batas 15 meter. Pegawai dan admin harus memiliki profil pegawai aktif serta kantor penempatan.</p><div class="punch-clock" id="clock" style="color:white;margin-top:18px">--:--:--</div></div><div class="punch-card"><div class="field"><label>Lokasi absensi</label><select id="punch-office" ${choices.length?'':'disabled'}>${choices.map(o=>`<option value="${esc(o.officeId)}">${esc(o.name)}${o.officeId===office?.officeId?' · Kantor utama':' · Penugasan'}</option>`).join('')}</select></div><div class="row"><button class="btn btn-primary" id="punch-in" ${today?.checkInAt||!choices.length?'disabled':''}>◎ &nbsp;Check-in</button><button class="btn btn-outline" id="punch-out" ${!today?.checkInAt||today?.checkOutAt||!choices.length?'disabled':''}>⇥ &nbsp;Check-out</button></div><p class="row-sub" style="margin-bottom:0">${choices.length?'Lokasi diminta oleh browser saat tombol absensi ditekan.':!boot.employee?'Profil pegawai belum ditautkan. Minta Super Admin membuat profil pegawai dan kantor aktif, lalu menautkannya melalui Pengaturan.':'Kantor penempatan aktif belum tersedia untuk profil Anda.'}</p></div></section><div class="grid grid-3 section-gap">${stat('Status',today?.checkOutAt?'Selesai':today?.checkInAt?'Sedang bertugas':'Belum hadir','◉')}${stat('Check-in',today?.checkInAt?fmt(today.checkInAt):'—','↗')}${stat('Check-out',today?.checkOutAt?fmt(today.checkOutAt):'—','↙')}</div><div class="notice info section-gap">Server mengukur jarak langsung dari koordinat GPS ke titik wilayah; jarak di atas 15 meter ditolak.</div>`;let timer=()=>$('#clock')&&($('#clock').textContent=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:'Asia/Jakarta'}).format(new Date()));timer();window.clockTimer=setInterval(timer,1000);if($('#punch-in'))$('#punch-in').onclick=()=>punch('checkIn');if($('#punch-out'))$('#punch-out').onclick=()=>punch('checkOut');},
async history(){const manager=ADMIN.includes(boot.user?.role);const requests=[api('attendanceHistory')];if(manager)requests.push(api('employeeList'));const result=await Promise.all(requests),rows=result[0],employees=result[1]||[],headers=manager?['Tanggal','Pegawai','Kantor','Check-in','Check-out','Terlambat']:['Tanggal','Kantor','Check-in','Check-out','Terlambat','Aksi'];const body=rows.map(a=>{const cells=['<td>'+esc(a.date)+'</td>'];if(manager)cells.push('<td>'+esc(employees.find(e=>String(e.employeeId)===String(a.employeeId))?.name||a.employeeId)+'</td>');cells.push('<td>'+esc(a.officeId)+'</td>','<td>'+esc(fmt(a.checkInAt))+'</td>','<td>'+esc(fmt(a.checkOutAt))+'</td>','<td>'+esc(a.lateMinutes||0)+' mnt</td>');if(!manager)cells.push('<td><button class="action-link" data-correct="'+esc(a.attendanceId)+'">Ajukan koreksi</button></td>');return '<tr>'+cells.join('')+'</tr>';}).join('');$('#main').innerHTML=title('history')+'<section class="card"><div class="toolbar"><div><h2>'+(manager?'Riwayat absensi wilayah':'Riwayat pribadi')+'</h2><div class="row-sub">Menampilkan hingga 120 catatan terbaru sesuai cakupan akses.</div></div>'+(!manager?'<button id="export-history" class="btn btn-outline">⇩ Ekspor CSV</button>':'')+'</div>'+table(headers,body)+'</section>';if(!manager){$('#export-history').onclick=()=>csvDownload('riwayat-absensi.csv',['Tanggal','Kantor','Check-in','Check-out','Terlambat'],rows.map(a=>[a.date,a.officeId,a.checkInAt,a.checkOutAt,a.lateMinutes]));$$('[data-correct]').forEach(b=>b.onclick=()=>correctionModal(b.dataset.correct));}},
async profile(){const p=await api('profile'),e=p.employee||{},u=p.user||{};$('#main').innerHTML=title('profile')+`<div class="grid grid-2"><section class="card"><div class="profile-head"><span class="avatar">${esc((e.name||u.email||'U')[0].toUpperCase())}</span><div><div class="profile-name">${esc(e.name||'Profil akun')}</div><div class="profile-meta">${esc(ROLE[u.role]||u.role||'')}</div></div></div><div class="kv"><span>Email akun</span><b>${esc(identityLabel(u.email))}</b></div><div class="kv"><span>Nomor identitas</span><b>${esc(e.identityNo)}</b></div><div class="kv"><span>Jabatan</span><b>${esc(e.position)}</b></div><div class="kv"><span>Unit kerja</span><b>${esc(e.unit)}</b></div><div class="kv"><span>Telepon</span><b>${esc(e.phone)}</b></div><div class="kv"><span>Status</span>${badge(e.status||u.status)}</div></section><section class="card"><h2>Penempatan kerja</h2><p class="row-sub">Kantor utama yang menjadi lokasi absensi reguler Anda.</p><div class="kv"><span>ID Kantor</span><b>${esc(e.primaryOfficeId)}</b></div><div class="kv"><span>Mulai bekerja</span><b>${esc(e.startDate)}</b></div><div class="notice info section-gap">Jika ada data profil yang perlu diperbaiki, hubungi administrator wilayah Anda.</div></section></div>`;},
async employees(){const [rows,offices]=await Promise.all([api('employeeList'),api('officeList')]);$('#main').innerHTML=title('employees',`<button id="add-employee" class="btn btn-primary">＋ Tambah pegawai</button>`)+`<section class="card"><div class="toolbar"><input class="control" id="table-search" placeholder="Cari nama atau email…"><span class="row-sub">${rows.length} pegawai dalam cakupan Anda</span></div><div id="employee-table">${employeeTable(rows)}</div></section>`;$('#add-employee').onclick=()=>employeeModal(null,offices);$('#table-search').oninput=e=>$('#employee-table').innerHTML=employeeTable(rows.filter(x=>(x.name+x.email+x.position).toLowerCase().includes(e.target.value.toLowerCase())));$$('[data-edit-employee]').forEach(b=>b.onclick=()=>employeeModal(rows.find(x=>x.employeeId===b.dataset.editEmployee),offices));},

async function punch(action){if(!navigator.geolocation)return toast('GPS tidak tersedia pada browser ini.',true);const btn=action==='checkIn'?$('#punch-in'):$('#punch-out');btn.disabled=true;btn.textContent='Mengambil lokasi…';navigator.geolocation.getCurrentPosition(async pos=>{try{await api(action,{officeId:$('#punch-office').value,latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy});toast('Absensi berhasil tercatat.');go('attendance');}catch(e){fail(e);btn.disabled=false;btn.textContent=action==='checkIn'?'◎  Check-in':'⇥  Check-out';}},err=>{toast(err.code===1?'Lokasi belum diizinkan. Aktifkan izin lokasi browser.':err.code===2?'GPS tidak tersedia. Periksa pengaturan perangkat.':'Permintaan GPS melewati batas waktu. Coba kembali.',true);btn.disabled=false;btn.textContent=action==='checkIn'?'◎  Check-in':'⇥  Check-out';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});}

function attendanceAreaModal(a){const body=`<input type="hidden" name="type" value="${esc(a.type)}"><input type="hidden" name="districtId" value="${esc(a.districtId)}"><input type="hidden" name="villageId" value="${esc(a.villageId)}"><div class="notice info">${esc(a.name)} — radius absensi tetap 15 meter. Tandai koordinat pusat area yang ditetapkan instansi.</div><div class="form-grid">${field('Latitude','latitude',a.latitude,'number',{required:true,step:'any',placeholder:'contoh: -8.06'})}${field('Longitude','longitude',a.longitude,'number',{required:true,step:'any',placeholder:'contoh: 111.90'})}</div><button type="button" class="btn btn-outline" id="capture-area-location">◎ Ambil koordinat perangkat ini</button><p class="row-sub" id="area-location-status"></p>`;modal('Koordinat absensi · '+a.name,body,fd=>api('attendanceAreaSave',fd));$('#capture-area-location').onclick=()=>{const status=$('#area-location-status');if(!navigator.geolocation){status.textContent='GPS tidak tersedia di browser ini.';return;}status.textContent='Mengambil koordinat…';navigator.geolocation.getCurrentPosition(pos=>{document.querySelector('[name=latitude]').value=pos.coords.latitude;document.querySelector('[name=longitude]').value=pos.coords.longitude;status.textContent='Koordinat terisi (akurasi perangkat ±'+Math.round(pos.coords.accuracy)+' m). Verifikasi titik sebelum menyimpan.';},err=>{status.textContent=err.message||'Tidak dapat mengambil lokasi.';},{enableHighAccuracy:true,timeout:20000,maximumAge:0});};}

function officeModal(o,org){const d=o||{},districts=org.districts||[],villages=org.villages||[],body=`<input type="hidden" name="officeId" value="${esc(d.officeId)}"><div class="form-grid">${field('Nama unit kerja','name',d.name,'text',{required:true})}${field('Jenis kantor','type',d.type||'DESA','select',{options:[['KECAMATAN','Kecamatan'],['DESA','Desa']]})}${field('Kecamatan','districtId',d.districtId||districts[0]?.districtId,'select',{options:districts.map(x=>[x.districtId,x.name])})}${field('Desa','villageId',d.villageId,'select',{options:[['','—'],...villages.map(x=>[x.villageId,x.name])]})}${field('Alamat','address',d.address,'text',{span:true})}${field('Status','status',d.status||'ACTIVE','select',{options:[['ACTIVE','Aktif'],['INACTIVE','Nonaktif']]})}</div><div class="notice info">Titik koordinat absensi dan radius tetap 15 meter diatur melalui menu Koordinat Absensi.</div>`;modal(o?'Ubah kantor':'Tambah kantor',body,fd=>api('officeSave',{office:fd}));}
function orgModal(kind,data){if(kind==='district'){modal('Tambah kecamatan',`<div class="form-grid">${field('Nama kecamatan','name','','text',{required:true})}${field('Kode kecamatan','code','','text',{required:true})}</div>`,fd=>api('orgSave',{kind,record:fd}));}else modal('Tambah desa',`<div class="form-grid">${field('Nama desa','name','','text',{required:true})}${field('Kode desa','code','','text',{required:true})}${field('Kecamatan','districtId',data.districts[0]?.districtId,'select',{required:true,options:data.districts.map(d=>[d.districtId,d.name])})}</div>`,fd=>api('orgSave',{kind,record:fd}));}
function scheduleModal(s,offices){const d=s||{},body=`<input type="hidden" name="scheduleId" value="${esc(d.scheduleId)}"><div class="form-grid">${field('Kantor','officeId',d.officeId||offices[0]?.officeId,'select',{required:true,options:offices.map(o=>[o.officeId,o.name])})}${field('Hari kerja (1 Senin – 7 Minggu, pisahkan koma)','days',d.days||'1,2,3,4,5','text',{span:true})}${field('Mulai kerja','workStart',d.workStart||'08:00','time',{required:true})}${field('Selesai kerja','workEnd',d.workEnd||'16:00','time',{required:true})}${field('Mulai check-in','checkInStart',d.checkInStart||'06:00','time',{required:true})}${field('Batas check-in','checkInEnd',d.checkInEnd||'09:00','time',{required:true})}${field('Mulai check-out','checkOutStart',d.checkOutStart||'15:00','time',{required:true})}${field('Batas check-out','checkOutEnd',d.checkOutEnd||'23:00','time',{required:true})}${field('Toleransi keterlambatan (menit)','lateToleranceM',d.lateToleranceM||0,'number',{min:0})}</div>`;modal(s?'Ubah jadwal':'Atur jadwal kerja',body,fd=>api('scheduleSave',{schedule:fd}));}
function holidayModal(offices){const body=`<div class="form-grid">${field('Tanggal','date','','date',{required:true})}${field('Nama hari libur','name','','text',{required:true})}${field('Jenis','type','NASIONAL','select',{options:[['NASIONAL','Nasional'],['DAERAH','Daerah'],['KHUSUS','Jadwal khusus']]})}${field('Berlaku untuk kantor','officeId','','select',{options:[['','Semua kantor'],...offices.map(o=>[o.officeId,o.name])]})}</div>`;modal('Tambah kalender libur',body,fd=>api('holidaySave',{holiday:fd}));}
function dutyModal(offices){const isAdmin=ADMIN.includes(boot.user.role),body=`<div class="form-grid">${isAdmin?field('ID pegawai','employeeId',boot.employee?.employeeId||'','text',{required:true}):''}${field('Kantor tujuan','officeId',offices[0]?.officeId,'select',{required:true,options:offices.map(o=>[o.officeId,o.name])})}${field('Mulai penugasan','startAt','','datetime-local',{required:true})}${field('Selesai penugasan','endAt','','datetime-local',{required:true})}${field('Alasan / dasar tugas','reason','','text',{required:true,span:true})}</div>`;modal('Ajukan penugasan dinas',body,fd=>api('dutyRequest',{...fd}));}
function dutyTable(rows,offices,manager){return table(['Pegawai','Kantor tujuan','Masa berlaku','Alasan','Status','Tindakan'],rows.map(d=>`<tr><td>${esc(d.employeeId)}</td><td>${esc(offices.find(o=>o.officeId===d.officeId)?.name||d.officeId)}</td><td>${esc(fmt(d.startAt))}<div class="row-sub">s.d. ${esc(fmt(d.endAt))}</div></td><td>${esc(d.reason)}</td><td>${badge(d.status)}</td><td>${manager&&d.status==='PENDING'?`<button class="btn btn-sm btn-soft" data-duty="${esc(d.dutyId)}" data-decision="APPROVED">Setujui</button> <button class="btn btn-sm btn-danger" data-duty="${esc(d.dutyId)}" data-decision="REJECTED">Tolak</button>`:'—'}</td></tr>`).join(''));}function wireDutyDecisions(){ $$('[data-duty]').forEach(b=>b.onclick=async()=>{if(!confirm('Simpan keputusan penugasan?'))return;try{await api('dutyDecision',{dutyId:b.dataset.duty,decision:b.dataset.decision});toast('Keputusan penugasan disimpan');go('duties');}catch(e){fail(e);}});}
function correctionModal(id){modal('Ajukan koreksi absensi',`<input type="hidden" name="attendanceId" value="${esc(id)}"><div class="form-grid">${field('Waktu check-in yang diajukan','checkInAt','','datetime-local')}${field('Waktu check-out yang diajukan','checkOutAt','','datetime-local')}${field('Alasan koreksi','reason','','text',{required:true,span:true})}</div>`,fd=>{const proposed={};if(fd.checkInAt)proposed.checkInAt=new Date(fd.checkInAt).toISOString();if(fd.checkOutAt)proposed.checkOutAt=new Date(fd.checkOutAt).toISOString();return api('correctionRequest',{attendanceId:fd.attendanceId,reason:fd.reason,proposed});});}
function renderReport(r,offices){const rows=r.rows||[],root=$('#report-result');root.innerHTML=`<div class="grid grid-3">${stat('Jumlah catatan',r.summary.total,'▤')}${stat('Terlambat',r.summary.late,'↗')}${stat('Check-out tercatat',r.summary.checkedOut,'✓')}</div><section class="card section-gap"><div class="toolbar"><div><h2>Rincian absensi</h2><div class="row-sub">${esc($('#r-from').value)} s.d. ${esc($('#r-to').value)}</div></div><div><button id="report-csv" class="btn btn-outline">⇩ CSV / Excel</button> <button id="report-print" class="btn btn-soft">Cetak / PDF</button></div></div>${table(['Tanggal','ID Pegawai','Kantor','Check-in','Check-out','Terlambat'],rows.map(a=>`<tr><td>${esc(a.date)}</td><td>${esc(a.employeeId)}</td><td>${esc(offices.find(o=>o.officeId===a.officeId)?.name||a.officeId)}</td><td>${esc(fmt(a.checkInAt))}</td><td>${esc(fmt(a.checkOutAt))}</td><td>${esc(a.lateMinutes||0)} mnt</td></tr>`).join(''))}</section>`;$('#report-csv').onclick=()=>csvDownload('laporan-absensi.csv',['Tanggal','ID Pegawai','Kantor','Check-in','Check-out','Terlambat'],rows.map(a=>[a.date,a.employeeId,a.officeId,a.checkInAt,a.checkOutAt,a.lateMinutes]));$('#report-print').onclick=()=>window.print();}
function registrationModal(r,org,employees,offices){const body=`<input type="hidden" name="requestId" value="${esc(r.requestId)}"><div class="notice info">Setujui akun <b>${esc(identityLabel(r.email))}</b> dengan role dan penempatan berikut.</div><div class="form-grid">${field('Role','role','PEGAWAI','select',{required:true,options:[['PEGAWAI','Pegawai'],['ADMIN_DESA','Admin Desa'],['ADMIN_KECAMATAN','Admin Kecamatan']]})}${field('Kecamatan','districtId','','select',{options:[['','—'],...org.districts.map(x=>[x.districtId,x.name])]})}${field('Desa','villageId','','select',{options:[['','—'],...org.villages.map(x=>[x.villageId,x.name])]})}${field('Profil pegawai jika sudah ada','employeeId','','select',{options:[['','Buat otomatis dari nama dan email'],...employees.map(x=>[x.employeeId,x.name+' · '+x.email])]})}${field('Kantor penempatan (wajib jika membuat profil baru)','officeId','','select',{options:[['','Pilih kantor jika membuat profil baru'],...offices.filter(x=>String(x.status).toUpperCase()==='ACTIVE').map(x=>[x.officeId,x.name])]})}</div><p class="row-sub">Jika profil pegawai belum ada, sistem membuatnya otomatis memakai nama dan email pendaftar.</p>`;modal('Setujui pendaftaran',body,fd=>api('registrationApprove',{requestId:fd.requestId,user:{email:r.email,role:fd.role,districtId:fd.districtId,villageId:fd.villageId,employeeId:fd.employeeId,officeId:fd.officeId}}),'Setujui & aktifkan');}
function userModal(u,org,employees){const d=u||{},body=`<input type="hidden" name="userId" value="${esc(d.userId)}"><div class="form-grid">${field('Email akun Google / username Firebase','email',d.email,'email',{required:true})}${field('Role','role',d.role||'PEGAWAI','select',{options:[['PEGAWAI','Pegawai'],['ADMIN_DESA','Admin Desa'],['ADMIN_KECAMATAN','Admin Kecamatan']]})}${field('Kecamatan','districtId',d.districtId,'select',{options:[['','—'],...org.districts.map(x=>[x.districtId,x.name])]})}${field('Desa','villageId',d.villageId,'select',{options:[['','—'],...org.villages.map(x=>[x.villageId,x.name])]})}${field('Profil pegawai aktif (wajib untuk absensi)','employeeId',d.employeeId||'','select',{required:true,options:[['','Pilih pegawai'],...employees.map(x=>[x.employeeId,x.name+' · '+x.email])]})}${field('Status akun','status',d.status||'ACTIVE','select',{options:[['ACTIVE','Aktif'],['INACTIVE','Nonaktif']]})}</div><div class="notice info">Profil pegawai harus sudah terdaftar dan aktif, dengan kantor penempatan aktif. Jika belum ada, buat profilnya lebih dahulu di menu Data Pegawai. Role menentukan batas akses di aplikasi.</div>`;modal(u?'Ubah akses akun':'Tambah akun',body,fd=>api('userSave',{user:fd}));}
function auditTable(rows){return table(['Waktu','Aktor','Tindakan','Entitas','ID Entitas'],rows.map(x=>`<tr><td>${esc(fmt(x.createdAt))}</td><td>${esc(x.actorId)}</td><td>${badge(x.action)}</td><td>${esc(x.entity)}</td><td>${esc(x.entityId)}</td></tr>`).join(''));}
init();
</script>
